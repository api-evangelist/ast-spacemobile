name: AST SpaceMobile
kind: company
description: >-
  AST SpaceMobile (NASDAQ, ASTS) is a United States satellite operator building
  the SpaceMobile Network, a space-based cellular broadband constellation of
  BlueBird satellites carrying the largest commercial phased-array antennas in
  low Earth orbit, designed to deliver 4G and 5G directly to standard,
  unmodified smartphones. It sits upstream of the retail telecom market as a
  wholesale coverage layer, not a consumer brand, not a CPaaS: signals from a
  handset are relayed by satellite to a small number of in-country ground
  gateways, which compensate for Doppler and delay and then hand the traffic
  into a mobile network operator's core, where the operator completes the call
  and bills the subscriber. Distribution runs entirely through partner carriers,
  with agreements covering nearly 60 mobile network operators serving over
  3 billion subscribers, including AT&T, Verizon, Vodafone, Rakuten, Bell,
  TELUS and stc, plus strategic investment from Google and American Tower.
  Its API posture is that of a satellite infrastructure company rather than a
  network-API publisher, honestly assessed as none: as of July 2026 AST
  SpaceMobile publishes no developer portal, no API documentation, no OpenAPI,
  no SDKs and no public network-API surface. Probes of developer, developers,
  docs, api and opengateway subdomains and the corresponding site paths all
  fail to resolve or return 404, and no CAMARA, GSMA Open Gateway, TM Forum or
  3GPP NEF exposure claim appears anywhere on ast-science.com or in its press
  releases. Any programmable access to SpaceMobile capacity reaches developers
  only indirectly, through the partner carrier that owns the subscriber
  relationship and the network APIs.
