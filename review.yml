aid: ast-spacemobile
name: AST SpaceMobile
review:
  question: Does AST SpaceMobile publish a public developer portal, downloadable API
    specifications, or any CAMARA / GSMA Open Gateway network-API surface?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United States
  tier: satellite-ntn
  gated: true
  portalConfirmed: false
  openapiHarvested: false
  specsCount: 0
findings:
  summary: |
    AST SpaceMobile publishes no developer surface of any kind. It is a
    satellite infrastructure company that sells wholesale space-based cellular
    coverage into mobile network operators' cores; the operator, not AST, owns
    the subscriber, the billing relationship and whatever network APIs exist.
    Every first-party developer host and path probed on 2026-07-25 either
    failed to resolve or returned 404. There is no API documentation, no
    OpenAPI or Swagger, no SDK, no Postman workspace, no GraphQL, no webhook
    catalog, no status page, no .well-known metadata, and no GitHub
    organization. The word "API" does not appear on ast-science.com's
    marketing, partner, network, how-it-works, FAQ or press-release pages.
    This is the expected and correct finding for a non-terrestrial-network
    operator at this stage: AST's product is radio coverage handed off at a
    ground gateway into a partner carrier's network, and the only programmable
    reach a developer has to SpaceMobile capacity is through that carrier.
  developerPortal:
